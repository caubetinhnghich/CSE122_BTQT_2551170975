<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bai26.css">
</head>

<body>
    <div class="container py-5">
        <div class="card form-card shadow mx-auto">
            <div class="card-header bg-success text-white text-center">
                <h4 class="mb-0 py-2">Đăng ký tham gia CLB lập trình Web</h4>
            </div>

            <div class="card-body p-4">
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="hoten" class="form-label">Họ và tên</label>

                            <input type="text" class="form-control" id="hoten" placeholder="Nguyễn Văn A" required>
                        </div>

                        <div class="col-md-6">
                            <label for="masv" class="form-label">Mã sinh viên</label>
                            <input type="text" class="form-control" id="masv" placeholder="22xxxxx" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                        </div>

                        <div class="col-md-6">
                            <label for="sdt" class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="sdt" placeholder="09xxxxxxxx" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label d-block">Trình độ</label>

                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" name="trinhdo" id="coban" value="Cơ bản" checked>
                                <label for="coban" class="form=check-label">Cơ bản</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" name="trinhdo" id="kha" value="Khá">
                                <label for="kha" class="form-check-label">Khá</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input type="radio" class="form-check-input" name="trinhdo" id="tot" value="Tốt">
                                <label for="tot" class="form-check-label">Tốt</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="lop" class="form-label">Chọn lớp</label>
                            <select id="lop" class="form-select" required>
                                <option value="67CNTT1">67CNT1T</option>
                                <option value="67CNTT2">67CNTT2</option>
                                <option value="67CNTT3">67CNTT3</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="camket" required>
                                <label for="camket" class="form-check-label">Tôi cam kết tự làm bài và quay video OBS</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end"></div>
                            <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                            <button type="submit" class="btn btn-success">Đăng ký</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
