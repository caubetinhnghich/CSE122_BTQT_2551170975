<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20</title>
    <link rel="stylesheet" href="bai20.css">
</head>
<body>
    <div class="frame">
        <div class="photo">
            <img src="/BT tren lop/Anh/Bai20/hoahong.jpg" alt="Hoa hồng" id="pic">
            <span>Hoa hồng</span>
        </div>
        <div class="caption">Special For You</div>
    </div>

    <div class="bar" id="bar"></div>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="wave">
            <feTurbulence type="turbulence" baseFrequency="0.01 0.05" numOctaves="2" result="noise">
                <animate attributeName="baseFrequency" dur="4s" values="0.01 0.05; 0.02 0.08;0.01 0.05" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12"/></feDisplacementMap>
        </filter>
    </svg>
    <script src="bai20.js"></script>
</body>
</html>
