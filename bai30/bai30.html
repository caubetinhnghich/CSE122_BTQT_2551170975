<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài 30</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="bai30.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <div class="sidebar p-3">
            <h6 class="text-white pb-3 border-bottom border-secondary">CSE.TLU Admin</h6>
            <ul class="nav flex-column gap-1 mt-3">
                <li class="nav-item"><a class="nav-link active" href="#">Bảng điều khiển</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Bài tập</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sinh viên</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Điểm số</a></li>
            </ul>
        </div>

        <div class="noidung flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0">Bảng điều khiển</h4>
                <div>
                    <span class="badge bg-warning text-dark me-2">3 bài mới</span>
                    <button class="btn btn-primary btn-sm">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <small class="text-muted">Sinh viên</small>
                            <h3 class="fw-bold">128</h3>
                            <div class="progress">
                                <div class="progress-bar bg-primary tl-sv"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <small class="text-muted">Đã nộp</small>
                            <h3 class="fw-bold">96</h3>
                            <div class="progress">
                                <div class="progress-bar bg-success tl-nop"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <small class="text-muted">Chưa nộp</small>
                            <h3 class="fw-bold">32</h3>
                            <div class="progress">
                                <div class="progress-bar bg-danger tl-chua"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <small class="text-muted">Điểm TB</small>
                            <h3 class="fw-bold">7.8</h3>
                            <div class="progress">
                                <div class="progress-bar bg-warning tl-diem"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-bold">Tiến độ theo chương</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 1 — HTML5
                        <span class="badge bg-success">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 2 — JavaScript
                        <span class="badge bg-info text-dark">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 3 — CSS3
                        <span class="badge bg-info text-dark">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Chương 4 — Bootstrap 5
                        <span class="badge bg-secondary">45%</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
