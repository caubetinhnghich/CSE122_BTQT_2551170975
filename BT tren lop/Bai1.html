<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trang thơ"Bốn mùa"</title>
    <style>
      body {
        background-color: #fffde7;
        border: 1px;
        border-style: solid;
        border-color: #9e9e9e;
        text-align: center;
        padding: 30px 0;
      }

      h1 {
        color: #d40000;
        background-color: #ffd9e6;
        font-weight: bold;
        text-align: center;
        margin: 20px auto 30px auto;
        padding: 15px;
        width: 60%;
      }

      hr {
        background-color: blue;
        height: 1px;
        width: 60%;
        border: none;
      }

      .poem {
        text-align: center;
        width: fit-content;
        margin: 0 auto;
      }

      .poem .p1 {
        color: #0033cc;
        font-style: italic;
      }

      .poem .p2 {
        color: #d40000;
        font-style: italic;
      }

      .poem .p3 {
        color: #0033cc;
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <h1>Bốn mùa</h1>
    <div class="poem">
      <p class="p1">
        Xuân về hoa nở khắp nơi<br />
        Hạ sang nắng cháy rạng ngời phố quen<br />
        Thu về lá rụng bên thềm<br />
      </p>
      <hr />
      <p class="p2">
        Đông sang gió lạnh bên em đợi chờ<br />
        Bốn mùa là bốn giấc mơ<br />
        Thời gian đi mãi ta chờ đợi ai<br />
      </p>
      <hr />
      <p class="p3">
        Một năm rồi lại một năm<br />
        Vẫn còn câu hát thì thầm quê hương<br />
        Chờ xuân nắng mới soi đường<br />
      </p>
    </div>
  </body>
</html>
